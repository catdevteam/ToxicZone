prefix: "&8[&b極光毒圈&8] &r"
only-player: "&c此指令只能由玩家執行。"
no-permission: "&c你沒有權限執行此操作。"
help: |-
  &b毒圈管理
  &f/tz &7開啟控制面板
  &f/tz arena list &7列出場地
  &f/tz arena create <名稱> &7建立場地
  &f/tz arena use <名稱> &7選取場地
  &f/tz arena delete <名稱> confirm &7刪除場地
  &f/tz [場地] status &7查看狀態
  &f/tz [場地] start &7開始縮圈
  &f/tz [場地] stop &7停止傷害與縮圈
  &f/tz [場地] center [世界 x z] &7設定中心
  &f/tz [場地] wand &7取得綁定場地的釣竿
  &f/tz [場地] radius <起始> [最小] &7設定半徑
  &f/tz [場地] time <秒數> &7設定時間
  &f/tz [場地] damage <傷害> [間隔秒數]
  &f/tz reload &7重載設定和粒子排程
  &f/tz version &7檢查插件版本
  &7玩家省略場地時使用自己選取的場地。
  &7控制台與指令方塊需明確指定場地。

