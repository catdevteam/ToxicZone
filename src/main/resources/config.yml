  particles:
    enabled: true
    interval-ticks: 10
    points: 720
    layers: 12
    vertical-spacing: 1.0
    view-distance: 64.0
    dust-size: 2.0
    line-spacing: 0.75
  github-repository: "catdevteam/ToxicZone"
arena:
  world: world
  center-x: 0.5
  center-z: 0.5
  start-radius: 200.0
  minimum-radius: 5.0
  shrink-duration-seconds: 1800
  running: false
  damage-after-respawn: false
  center-beam: false
  eliminated-players: []
  selection-boundary:
    enabled: false
    min-x: 0.0
    max-x: 0.0
    min-z: 0.0
    max-z: 0.0
